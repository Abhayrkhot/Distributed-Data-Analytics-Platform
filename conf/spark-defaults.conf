# Cluster-wide Spark defaults, mounted read-only into every Spark container.
#
# These are the *defaults*. The Phase 8 benchmark deliberately overrides several
# of them at submit time (--conf) to compare a naive layout against a tuned one,
# so treat this file as the tuned baseline rather than as fixed truth.
#
# Memory arithmetic matters here: each worker advertises 1000M, so
#   executor.memory (700m) + executor.memoryOverhead (256m) = 956m <= 1000m.
# Exceed that and the executor is never scheduled and the app hangs in WAITING.

spark.master                                     spark://spark-master:7077
spark.sql.session.timeZone                       UTC
spark.serializer                                 org.apache.spark.serializer.KryoSerializer

# ---- resources -------------------------------------------------------------
spark.driver.memory                              768m
spark.executor.memory                            700m
spark.executor.memoryOverhead                    256m
spark.executor.cores                             2
spark.cores.max                                  4

# ---- event logging (feeds the history server and the benchmark harness) ----
spark.eventLog.enabled                           true
spark.eventLog.dir                               file:/data/spark-events
spark.history.fs.logDirectory                    file:/data/spark-events

# ---- adaptive execution ----------------------------------------------------
spark.sql.adaptive.enabled                       true
spark.sql.adaptive.coalescePartitions.enabled    true
spark.sql.adaptive.skewJoin.enabled              true
# Sized to total cluster cores (4), not the 200 default. On a dataset this size
# the 200-partition default is almost pure scheduler overhead.
spark.sql.shuffle.partitions                     12

# ---- io --------------------------------------------------------------------
spark.sql.parquet.compression.codec              zstd
spark.sql.files.maxPartitionBytes                134217728
spark.sql.parquet.filterPushdown                 true
spark.sql.parquet.mergeSchema                    false

# ---- application jars ------------------------------------------------------
spark.driver.extraClassPath                      /opt/jars/*
spark.executor.extraClassPath                    /opt/jars/*
